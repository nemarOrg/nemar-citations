name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  UV_PYTHON: "3.13"
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install ruff + ty
        run: uv tool install ruff && uv tool install ty

      - name: Ruff format check
        run: uv tool run ruff format --check src/ tests/

      - name: Ruff lint
        run: uv tool run ruff check src/ tests/

      - name: Ty type check
        run: uv tool run ty check src/ || true  # ty is preview; do not fail CI yet

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Sync project (CPU-only torch index)
        env:
          UV_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
          UV_INDEX_STRATEGY: unsafe-best-match
        run: uv sync --python ${{ matrix.python-version }} --all-extras

      - name: Run fast tests with coverage
        run: |
          uv run pytest tests/ \
            --cov=dataset_citations \
            --cov-report=xml \
            --cov-report=term-missing \
            -v \
            --maxfail=5

      - name: Citation attribution audit (report-only)
        # Surfaces the summed-vs-unique inflation and over-spread umbrella
        # anchors on every run. Report-only for now: flip to --fail-on-violation
        # on the deploy workflow once the anchor-judgment backfill is complete.
        continue-on-error: true
        run: |
          uv run dataset-citations-audit-attribution \
            --citations-dir citations/json_opencite \
            --max-datasets-per-anchor 5 \
            --top 25

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v5
        with:
          # codecov v5 dropped tokenless uploads; without CODECOV_TOKEN the
          # upload silently no-ops (fail_ci_if_error stays false so CI is not
          # blocked). Add the CODECOV_TOKEN repo secret to restore delivery.
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync project
        env:
          UV_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
          UV_INDEX_STRATEGY: unsafe-best-match
        run: uv sync --python 3.13 --all-extras

      - name: Run integration tests
        env:
          # Optional opencite keys; opencite degrades to unauthenticated
          # access if missing, so this step does not require them.
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          PUBMED_API_KEY: ${{ secrets.PUBMED_API_KEY }}
        run: |
          # opencite-anchored sources + backend integration suite.
          uv run pytest \
            tests/test_sources_doi.py \
            tests/test_sources_nemar_metadata.py \
            tests/test_sources_bids_metadata.py \
            tests/test_sources_github_error.py \
            tests/test_backends_opencite.py \
            tests/test_core_opencite_pipeline.py \
            tests/test_cli_update_backend.py \
            tests/test_citation_utils_provenance.py \
            -v --tb=short

      - name: Test CLI commands
        run: |
          # Every CLI the hallu cron invokes must at least resolve and parse
          # args. The retired dataset-citations-create-reports step used to
          # live here; the dashboard is an Astro build now (#127 P8), covered
          # by deploy-dashboard.yml's own verify step.
          for cmd in discover retrieve-metadata judge-anchors update \
                     prune-mirrored find-mentions dedupe score-confidence \
                     generate-embeddings analyze-umap export-umap-points \
                     export-modalities; do
            echo "--- dataset-citations-$cmd ---"
            uv run "dataset-citations-$cmd" --help > /dev/null
          done

  end-to-end-test:
    name: End-to-End Workflow Test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync project
        env:
          UV_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
          UV_INDEX_STRATEGY: unsafe-best-match
        run: uv sync --python 3.13 --all-extras

      - name: Run end-to-end workflow test
        run: |
          chmod +x run_end_to_end_workflow.sh
          ./run_end_to_end_workflow.sh test

          if [ -d "test_output_*" ]; then
            echo "Test outputs created successfully"
            find test_output_* -type f -name "*.html" -o -name "*.json" | head -20
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-outputs
          path: |
            test_output_*/
            logs/
          retention-days: 7

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
