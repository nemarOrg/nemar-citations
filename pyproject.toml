[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset_citations"
version = "2.0.0"
description = "Automated BIDS dataset citation tracking and JSON generation system"
readme = "README.md"
license = {text = "Copyright Reserved"}
authors = [
    {name = "Seyed Yahya Shirazi", email = "shirazi@ieee.org"},
]
maintainers = [
    {name = "Seyed Yahya Shirazi", email = "shirazi@ieee.org"},
]
keywords = [
    "citations",
    "BIDS",
    "neuroscience",
    "datasets",
    "opencite",
    "bibliography",
    "research",
    "automation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=1.3.0",
    "requests>=2.25.0",
    "beautifulsoup4>=4.9.0",
    "python-dotenv>=0.19.0",
    "httpx>=0.27.0",
    "sentence-transformers>=2.0.0",
    "PyGithub>=1.55.0",
    "neo4j>=5.0.0",
    "networkx>=3.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "umap-learn>=0.5.0",
    "scikit-learn>=1.0.0",
    "wordcloud>=1.8.0",
    "jinja2>=3.0.0",
    "opencite @ git+https://github.com/neuromechanist/opencite.git@v0.5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "ruff>=0.16.1",
    "ty>=0.0.1a13",
    "pre-commit>=2.15",
]
test = [
    "pytest>=6.0",
    "pytest-cov>=2.12",
]

[project.urls]
Homepage = "https://github.com/nemarOrg/nemar-citations"
Repository = "https://github.com/nemarOrg/nemar-citations"
Documentation = "https://github.com/nemarOrg/nemar-citations/blob/main/README.md"
"Bug Reports" = "https://github.com/nemarOrg/nemar-citations/issues"

[project.scripts]
dataset-citations-discover = "dataset_citations.cli.discover:main"
dataset-citations-update = "dataset_citations.cli.update:main"
dataset-citations-find-mentions = "dataset_citations.cli.find_mentions:main"
dataset-citations-prune-mirrored = "dataset_citations.cli.prune_mirrored:main"
dataset-citations-dedupe = "dataset_citations.cli.dedupe_citations:main"
dataset-citations-regenerate = "dataset_citations.cli.regenerate:main"
dataset-citations-retrieve-metadata = "dataset_citations.cli.retrieve_metadata:main"
dataset-citations-judge-anchors = "dataset_citations.cli.judge_anchors:main"
dataset-citations-score-confidence = "dataset_citations.cli.score_confidence:main"
dataset-citations-analyze-temporal = "dataset_citations.cli.analyze_temporal:main"
dataset-citations-load-graph = "dataset_citations.cli.load_graph:main"
dataset-citations-analyze-networks = "dataset_citations.cli.analyze_networks:main"
dataset-citations-create-visualizations = "dataset_citations.cli.create_visualizations:main"
dataset-citations-create-network-visualizations = "dataset_citations.cli.create_network_visualizations:main"
dataset-citations-generate-embeddings = "dataset_citations.cli.generate_embeddings:main"
dataset-citations-analyze-umap = "dataset_citations.cli.analyze_umap:main"
dataset-citations-create-theme-networks = "dataset_citations.cli.create_theme_networks:main"
dataset-citations-create-research-context-networks = "dataset_citations.cli.create_research_context_networks:main"
dataset-citations-manage-embeddings = "dataset_citations.cli.manage_embeddings:main"
dataset-citations-analyze-temporal-themes = "dataset_citations.cli.analyze_temporal_themes:main"
dataset-citations-automate-updates = "dataset_citations.cli.automate_updates:main"
dataset-citations-export-external-tools = "dataset_citations.cli.export_external_tools:main"
dataset-citations-automate-visualization-updates = "dataset_citations.cli.automate_visualization_updates:main"
dataset-citations-audit-attribution = "dataset_citations.cli.audit_attribution:main"
dataset-citations-export-umap-points = "dataset_citations.cli.export_umap_points:main"
dataset-citations-export-modalities = "dataset_citations.cli.export_modalities:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = [
    ".git",
    ".ty_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
]

[tool.ruff.lint]
# Declare the rule set explicitly instead of inheriting ruff's default, which
# is a moving target: ruff 0.16 widened that default from a handful of rules to
# most of the catalog, which turned `main` red overnight with 721 findings and
# blocked every open PR (issue #199). Pinning the selection here means a ruff
# upgrade changes lint only when we choose to change this list.
select = [
    "E4", "E7", "E9",  # pycodestyle: the subset ruff has always defaulted to
    "F",               # pyflakes
    "I",               # isort
    "UP",              # pyupgrade: modern syntax for our py313 floor
    "DTZ",             # timezone-aware datetimes (see utils/datetime_utils.py)
    "LOG",             # module loggers, never the root logger
    "EXE",             # shebang/permission consistency
    "SIM", "C4", "PIE", "PERF", "FURB",  # readability + obvious inefficiency
    "B",               # bugbear
    "S",               # bandit security checks
    "RUF",
]
# Every blind `except Exception` in this package sits at a deliberate batch
# resilience boundary: the pipelines iterate ~750 datasets, and one unparseable
# file or one upstream library raising something undocumented must not kill a
# nightly run. All 42 current sites log or re-raise, so the project rule that
# actually matters (no silent failures, see AGENTS.md) is satisfied. Narrowing
# them would mean enumerating every failure mode of torch, sentence-transformers
# and networkx, where a miss becomes a 03:00 crash rather than a logged skip.
ignore = [
    "BLE001",
    # The embedding store is pickle by design (`embeddings/*.pkl`, written and
    # read only by this package from its own working tree). S301 is about
    # deserializing untrusted input, which is not the threat model here.
    "S301",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert; that is the job. S603/S607 cover the preflight tests that shell
# out to `bash -n` to syntax-check the cron scripts, with no untrusted input.
"tests/*" = ["S101", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["dataset_citations"]

[tool.ty.src]
include = ["src"]

[tool.ty.rules]
unresolved-import = "warn"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*" 